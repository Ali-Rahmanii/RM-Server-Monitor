<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitorbot Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Vazirmatn', 'sans-serif'] },
                    colors: {
                        bg: '#0a0e17',
                        panel: 'rgba(255,255,255,0.04)',
                        border: 'rgba(255,255,255,0.08)',
                    },
                    boxShadow: {
                        glow: '0 0 40px -10px rgba(99,102,241,0.35)',
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-bg text-slate-100 font-sans min-h-screen">
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-[32rem] h-[32rem] bg-indigo-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute top-1/3 -left-40 w-[28rem] h-[28rem] bg-emerald-500/10 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-fuchsia-600/10 rounded-full blur-[120px]"></div>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-30 backdrop-blur-xl bg-bg/70 border-b border-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-3 flex-wrap">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-fuchsia-600 flex items-center justify-center text-xl shadow-glow">🖥</div>
                <div>
                    <h1 class="text-lg font-bold leading-tight">Monitorbot</h1>
                    <p class="text-xs text-slate-400">مانیتورینگ لحظه‌ای سرورها</p>
                </div>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
                <div id="interval-display" class="text-xs text-slate-400 bg-white/5 border border-border rounded-lg px-3 py-2 hidden sm:block">فاصله چک: -</div>
                <button id="btn-scan-now" class="btn-glass text-sm">⚡ اسکن فوری</button>
                <button id="btn-add-server" class="btn-glass text-sm">✎ افزودن دستی</button>
                <button id="btn-deploy-server" class="btn-primary text-sm">🚀 استقرار خودکار (SSH)</button>
                <button id="btn-settings" class="btn-glass text-sm">⚙️ تنظیمات</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
        <div id="summary-bar" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6"></div>
        <div id="server-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </main>

    <!-- مودال افزودن دستی -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="glass-panel modal-box">
            <h2 id="modal-title" class="text-lg font-bold mb-4">افزودن سرور</h2>
            <form id="server-form" class="space-y-3">
                <input type="hidden" id="f-id">
                <label class="field"><span>نام</span><input id="f-name" required></label>
                <label class="field"><span>آی‌پی</span><input id="f-ip" required></label>
                <label class="field"><span>پورت ایجنت</span><input id="f-port" type="number" value="5100" required></label>
                <label class="field"><span>توکن</span><input id="f-token"></label>
                <label class="field"><span>گروه</span><input id="f-group"></label>
                <div class="flex gap-2 justify-end pt-2">
                    <button type="submit" class="btn-primary">ذخیره</button>
                    <button type="button" id="btn-cancel" class="btn-glass">انصراف</button>
                </div>
            </form>
        </div>
    </div>

    <!-- مودال استقرار خودکار از راه SSH -->
    <div id="deploy-overlay" class="modal-overlay hidden">
        <div class="glass-panel modal-box">
            <h2 class="text-lg font-bold mb-1">🚀 استقرار خودکار ایجنت</h2>
            <p class="text-xs text-slate-400 mb-4">با SSH به سرور وصل می‌شود، اسکریپت نصب را اجرا می‌کند و خودکار ثبتش می‌کند.</p>
            <form id="deploy-form" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <label class="field col-span-2"><span>نام سرور</span><input id="d-name" required></label>
                    <label class="field col-span-2"><span>آی‌پی</span><input id="d-ip" required></label>
                    <label class="field"><span>پورت SSH</span><input id="d-ssh-port" type="number" value="22" required></label>
                    <label class="field"><span>کاربر SSH</span><input id="d-ssh-user" value="root" required></label>
                    <label class="field col-span-2"><span>گروه (اختیاری)</span><input id="d-group"></label>
                </div>

                <div class="flex gap-2 text-xs mt-2">
                    <button type="button" data-auth="password" class="auth-tab auth-tab-active">رمز عبور</button>
                    <button type="button" data-auth="key" class="auth-tab">کلید خصوصی SSH</button>
                </div>
                <div id="auth-password-panel" class="field"><span>رمز عبور SSH</span><input id="d-ssh-pass" type="password"></div>
                <div id="auth-key-panel" class="field hidden">
                    <span>کلید خصوصی (PEM)</span>
                    <textarea id="d-ssh-key" rows="4" class="font-mono text-xs" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea>
                    <span class="mt-2">passphrase (اختیاری)</span>
                    <input id="d-ssh-key-pass" type="password">
                </div>

                <div id="deploy-status" class="hidden text-xs rounded-lg p-3 border"></div>

                <div class="flex gap-2 justify-end pt-2">
                    <button type="submit" id="btn-deploy-submit" class="btn-primary">شروع نصب</button>
                    <button type="button" id="btn-deploy-cancel" class="btn-glass">انصراف</button>
                </div>
            </form>
        </div>
    </div>

    <!-- مودال تنظیمات -->
    <div id="settings-overlay" class="modal-overlay hidden">
        <div class="glass-panel modal-box">
            <h2 class="text-lg font-bold mb-4">⚙️ تنظیمات</h2>

            <div class="mb-5">
                <div class="text-sm font-semibold mb-2">فاصله‌ی چک خودکار</div>
                <div class="flex gap-2 items-end">
                    <label class="field flex-1"><span>دقیقه</span><input id="s-interval" type="number" min="1"></label>
                    <button id="btn-save-interval" class="btn-primary">ذخیره</button>
                </div>
                <div id="settings-interval-status" class="text-xs mt-2 hidden"></div>
            </div>

            <div class="border-t border-border pt-4">
                <div class="text-sm font-semibold mb-2">پشتیبان‌گیری و بازیابی دیتابیس</div>
                <div class="flex flex-wrap gap-2 mb-3">
                    <button id="btn-backup-now" class="btn-glass text-sm">⬇️ دانلود بکاپ (.db)</button>
                </div>
                <label class="field">
                    <span>بازیابی از فایل بکاپ (.db) — دیتابیس فعلی جایگزین می‌شود</span>
                    <input id="s-restore-file" type="file" accept=".db">
                </label>
                <button id="btn-restore-upload" class="btn-danger text-sm mt-2">♻️ بازیابی از فایل</button>
                <div id="settings-restore-status" class="text-xs mt-2 hidden"></div>
            </div>

            <div class="flex gap-2 justify-end pt-4">
                <button type="button" id="btn-settings-close" class="btn-glass">بستن</button>
            </div>
        </div>
    </div>

    <!-- مودال جزئیات سرور -->
    <div id="detail-overlay" class="modal-overlay hidden">
        <div class="glass-panel modal-box wide">
            <div class="flex items-start justify-between mb-4">
                <div>
                    <h2 id="detail-title" class="text-lg font-bold"></h2>
                    <p id="detail-sub" class="text-xs text-slate-400"></p>
                </div>
                <button type="button" id="btn-detail-close" class="btn-glass text-sm">✕ بستن</button>
            </div>
            <div id="detail-body"></div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
